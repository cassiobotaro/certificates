[project]
name = "certificates"
version = "2.3.5"
description = "Generate event certificates easily."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
authors = [
    { name = "Cassio Botaro", email = "cassiobotaro@gmail.com" },
]
keywords = ["certificate", "certificates", "event", "svg", "png", "inkscape"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/cassiobotaro/certificates"
Repository = "https://github.com/cassiobotaro/certificates"
Issues = "https://github.com/cassiobotaro/certificates/issues"
Changelog = "https://github.com/cassiobotaro/certificates/releases"

[project.scripts]
certificates = "certificates.__main__:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# flat layout: the package lives in ./certificates, not ./src/certificates
module-root = ""

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "RUF", "PT"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
addopts = "--cov=certificates"
testpaths = "tests/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
]
