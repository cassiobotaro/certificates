[project]
name = "certificates"
version = "2.3.5"
description = "Generate event certificates easily."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
authors = [
    { name = "Cassio Botaro", email = "cassiobotaro@gmail.com" },
]

[project.urls]
Repository = "https://github.com/cassiobotaro/certificates"

[project.scripts]
certificates = "certificates.__main__:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# flat layout: the package lives in ./certificates, not ./src/certificates
module-root = ""

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
addopts = "--cov=certificates"
testpaths = "tests/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
]
